<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KK 音標全攻略｜互動學習</title><style>
:root{--rose:#2563eb;--pink:#dbeafe;--paper:#ffffff;--ink:#1e293b;--muted:#64748b;--line:#dbe5f1;--bg:#f3f8ff}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:var(--ink);background:var(--bg)}button,select{font:inherit}button{cursor:pointer}header{background:linear-gradient(135deg,#dbeafe,#eff6ff);padding:26px max(20px,calc((100vw - 1100px)/2));border-bottom:1px solid #bfdbfe}header h1{font-size:clamp(27px,4vw,44px);margin:8px 0}header p{margin:5px 0;color:#475569}.eyebrow{font-size:12px;font-weight:800;letter-spacing:2px;color:var(--rose)}.shell{max-width:1100px;margin:auto;padding:22px 18px 60px}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}.tab,.chip{border:1px solid #cbdcf3;border-radius:12px;background:white;padding:10px 15px;color:#334155}.tab.active,.chip.active{background:var(--rose);color:white;border-color:var(--rose)}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:16px;box-shadow:0 4px 18px #1d4ed810}.panel h2{margin:0 0 10px}.muted{color:var(--muted);font-size:14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat{background:white;border:1px solid var(--line);border-radius:14px;padding:18px}.stat b{display:block;color:var(--rose);font-size:28px}.stat span{font-size:13px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:10px}.sound{border:1px solid #cbdcf3;border-radius:13px;padding:15px 8px;background:#f8fbff;text-align:center;min-height:100px}.sound:hover{border-color:var(--rose);background:#eff6ff}.sound strong{font-size:27px;display:block}.sound small{display:block;margin-top:7px;color:#64748b}.row{display:flex;flex-wrap:wrap;gap:9px;align-items:center}.primary{background:var(--rose);border:1px solid var(--rose);color:white;border-radius:11px;padding:11px 16px}.secondary{background:white;border:1px solid #93c5fd;color:#1d4ed8;border-radius:11px;padding:10px 15px}.unit{border:1px solid var(--line);border-radius:14px;padding:16px;margin:10px 0}.unit h3{margin:0 0 8px}.pill{display:inline-block;background:#dbeafe;color:#1d4ed8;padding:4px 9px;border-radius:20px;font-size:12px;margin-right:5px;margin-bottom:6px}.words{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}.word{background:#f8fbff;border:1px solid #dbeafe;border-radius:12px;padding:13px}.word b{display:block;font-size:19px}.word small{color:#64748b}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0}.choice{border:1px solid #cbd5e1;background:white;border-radius:12px;padding:15px;text-align:left}.choice.selected{border-color:var(--rose);background:#eff6ff}.choice.good{border-color:#27966a;background:#e9f8f1}.choice.bad{border-color:#c74c5c;background:#eff6ff}.feedback{padding:14px;background:#f1f5f9;border-radius:12px;margin:12px 0}.progress{height:9px;background:#dbeafe;border-radius:10px;overflow:hidden;margin:14px 0}.progress div{height:100%;background:var(--rose)}select{padding:10px;border:1px solid #bfdbfe;border-radius:10px;background:white;max-width:100%}footer{font-size:12px;color:#64748b;text-align:center;padding:18px}.hidden{display:none!important}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.choices{grid-template-columns:1fr}.panel{padding:17px}.shell{padding:14px 12px 40px}} </style></head><body><header><div class="eyebrow">KK 音標全攻略 · INTERACTIVE GUIDE</div><h1>從認識音標，到真正會發音。</h1><p>41 個 KK 音標｜9 大教學單元｜4,100 題分級練習</p></header><main class="shell"><div class="stats"><div class="stat"><b>41</b><span>KK 音標</span></div><div class="stat"><b>9</b><span>教學單元</span></div><div class="stat"><b>4,100</b><span>題庫編號／練習變式</span></div><div class="stat"><b id="doneCount">0</b><span>已完成作答</span></div></div><nav class="tabs"><button class="tab active" data-tab="lookup">01 速查篇</button><button class="tab" data-tab="lesson">02 教學篇</button><button class="tab" data-tab="practice">03 實戰篇</button><button class="tab" data-tab="mistakes">錯題複習</button></nav><section id="lookup"></section><section id="lesson" class="hidden"></section><section id="practice" class="hidden"></section><section id="mistakes" class="hidden"></section></main><footer>發音由瀏覽器語音合成提供，可能因裝置及語音引擎不同而有差異。此為教學網站第一版。</footer><script>
const raw=[
['i','母音','see|sheep|green|tree|meet|feet','舌位高、嘴角向兩側拉開','ɪ'],['ɪ','母音','sit|ship|fish|big|milk|win','舌位略低於 [i]，肌肉放鬆','i'],['e','母音','say|day|make|rain|cake|late','發音由中前位置向高前位置滑動','ɛ'],['ɛ','母音','bed|pen|red|head|ten|desk','嘴巴中度張開，舌頭向前','æ'],['æ','母音','cat|hat|bag|map|apple|hand','嘴巴張大，舌頭前低','ɛ'],['u','母音','food|blue|moon|school|room|soon','雙唇收圓，舌位高而靠後','ʊ'],['ʊ','母音','book|good|foot|put|look|cook','嘴唇略圓，舌頭較放鬆','u'],['o','母音','go|home|no|boat|road|coat','由後中母音向較高位置滑動','ɔ'],['ɔ','母音','law|saw|talk|caught|draw|thought','後方較開的圓唇母音；美式口音可能合併','ɑ'],['ɑ','母音','hot|father|not|box|stop|rock','嘴巴張大，舌頭偏後低','ɔ'],['ə','母音','about|sofa|banana|ago|alone|panda','弱讀的中央母音，短且放鬆','ʌ'],['ʌ','母音','cup|sun|bus|luck|run|love','中央偏低的重讀母音','ə'],['ɚ','母音','teacher|mother|sister|better|water|letter','非重讀的捲舌母音','ɝ'],['ɝ','母音','bird|word|her|turn|girl|first','重讀的捲舌母音','ɚ'],['aɪ','母音','my|time|bike|five|light|rice','由開口滑向前高位置','ɔɪ'],['aʊ','母音','now|out|house|cow|down|mouth','由開口滑向後高圓唇位置','o'],['ɔɪ','母音','boy|coin|toy|join|voice|oil','由後圓唇位置滑向前高位置','aɪ'],
['p','子音','pen|pig|cap|map|paper|happy','雙唇閉合後送氣，清音','b'],['b','子音','bed|big|cab|baby|boat|ball','雙唇閉合後發聲，濁音','p'],['t','子音','top|tea|cat|time|ten|table','舌尖抵齒齦後放開，清音','d'],['d','子音','dog|day|red|door|dad|deep','舌尖抵齒齦後放開，濁音','t'],['k','子音','cat|key|back|cake|cook|king','舌根抵軟顎後放開，清音','g'],['g','子音','go|game|bag|good|girl|green','舌根抵軟顎後放開，濁音','k'],['f','子音','fan|fish|leaf|fine|food|coffee','上齒輕碰下唇，送氣','v'],['v','子音','van|very|five|voice|love|seven','上齒輕碰下唇，聲帶振動','f'],['θ','子音','think|thin|three|bath|mouth|teeth','舌尖輕放上下齒間，清音','s'],['ð','子音','this|that|these|mother|brother|they','舌尖輕放上下齒間，濁音','θ'],['s','子音','sun|see|bus|rice|sit|class','齒齦附近形成狹縫，清音','z'],['z','子音','zoo|zero|zip|nose|rose|lazy','齒齦附近形成狹縫，濁音','s'],['ʃ','子音','she|ship|shop|fish|shoe|wash','舌面靠近齒齦後部，清音','ʒ'],['ʒ','子音','vision|measure|usual|pleasure|treasure|decision','舌面靠近齒齦後部，濁音','ʃ'],['tʃ','子音','chair|chicken|watch|teacher|cheese|church','先阻塞再摩擦的清塞擦音','dʒ'],['dʒ','子音','job|jump|juice|age|giant|jacket','先阻塞再摩擦的濁塞擦音','tʃ'],['h','子音','hat|home|hello|house|happy|hand','喉部呼氣，聲帶不振動','f'],['m','子音','man|mom|map|summer|milk|name','雙唇閉合，氣流經鼻腔','n'],['n','子音','no|name|sun|nine|nose|nice','舌尖抵齒齦，氣流經鼻腔','ŋ'],['ŋ','子音','sing|song|long|king|ring|thing','舌根抵軟顎，氣流經鼻腔','n'],['l','子音','light|love|leaf|ball|look|blue','舌尖接近齒齦，氣流從兩側通過','r'],['r','子音','red|run|right|rain|road|rice','舌頭後縮，不碰上顎','l'],['w','子音','we|win|water|way|wood|wet','雙唇收圓後迅速滑向母音','v'],['j','子音','yes|you|yellow|year|young|yesterday','舌位高前，迅速滑向後續母音','dʒ'] ];
const P=raw.map((r,i)=>({id:i,s:r[0],kind:r[1],words:r[2].split('|'),tip:r[3],confuse:r[4]}));
const units=[['前母音','i ɪ e ɛ æ'],['後母音與中央母音','ɑ ɔ o ʊ u ʌ ə'],['雙母音與捲舌母音','aɪ aʊ ɔɪ ɝ ɚ'],['爆破子音','p b t d k g'],['摩擦子音（一）','f v θ ð s z'],['摩擦子音（二）與塞擦音','ʃ ʒ tʃ dʒ'],['鼻音','m n ŋ'],['舌音與滑音','l r w j'],['h 與綜合辨音','h']];
const by=s=>P.find(p=>p.s===s);const html=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');const storeKey='kk_guide_v1';let saved;try{saved=JSON.parse(localStorage.getItem(storeKey))||{done:{},wrong:{}}}catch(e){saved={done:{},wrong:{}}}saved.done ||= {};saved.wrong ||= {};
const save=()=>{try{localStorage.setItem(storeKey,JSON.stringify(saved))}catch(e){}document.querySelector('#doneCount').textContent=Object.keys(saved.done).length};save();
function speak(word){if(!('speechSynthesis'in window)){alert('此瀏覽器不支援語音播放');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(word);u.lang='en-US';u.rate=.78;speechSynthesis.speak(u)}
window.speak=speak;
function activate(t){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));['lookup','lesson','practice','mistakes'].forEach(id=>document.getElementById(id).classList.toggle('hidden',id!==t));if(t==='mistakes')renderMistakes()}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>activate(b.dataset.tab));
let filter='全部';function renderLookup(){let items=P.filter(p=>filter==='全部'||p.kind===filter);document.querySelector('#lookup').innerHTML=`<div class="panel"><h2>01｜41 個 KK 音標速查</h2><p class="muted">點選音標查看嘴型提示、例字與易混淆音。發音按鈕播放代表單字。</p><div class="row" id="filters"></div><div class="grid" id="sounds"></div></div><div class="panel" id="detail"><p class="muted">請先點選一個音標。</p></div>`;document.querySelector('#filters').innerHTML=['全部','母音','子音'].map(x=>`<button class="chip ${x===filter?'active':''}" data-filter="${x}">${x}</button>`).join('');document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;renderLookup()});document.querySelector('#sounds').innerHTML=items.map(p=>`<button class="sound" data-s="${p.id}"><strong>[${p.s}]</strong><small>${p.words[0]}</small></button>`).join('');document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>showSound(+b.dataset.s))}
function showSound(i){const p=P[i],c=by(p.confuse);document.querySelector('#detail').innerHTML=`<h2>[${p.s}]　${p.kind}</h2><p>${p.tip}</p><p><b>易混淆：</b>[${c.s}] — ${c.tip}</p><h3>代表單字（點擊播放）</h3><div class="words">${p.words.map(w=>`<button class="word" data-say="${w}"><b>${w} 🔊</b><small>美式英語單字發音</small></button>`).join('')}</div><div class="row" style="margin-top:16px"><button class="primary" id="goPractice">練習這個音標 →</button></div>`;document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(b.dataset.say));document.querySelector('#goPractice').onclick=()=>{document.querySelector('#phoneme').value=String(p.id);activate('practice');startQuiz()}}
function renderLessons(){document.querySelector('#lesson').innerHTML=`<div class="panel"><h2>02｜9 大單元循序學習</h2><p class="muted">每單元提供音標概念、發音提示、例字與對比練習。第九單元另包含綜合複習。</p>${units.map((u,i)=>`<div class="unit"><h3>單元 ${String(i+1).padStart(2,'0')}｜${u[0]}</h3><div>${u[1].split(' ').map(s=>`<span class="pill">[${s}]</span>`).join('')}</div><div class="row"><button class="secondary" data-unit="${i}">展開本單元</button></div><div id="unit-${i}" class="hidden"></div></div>`).join('')}</div>`;document.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{const i=+b.dataset.unit,el=document.getElementById('unit-'+i);el.classList.toggle('hidden');if(el.classList.contains('hidden'))return;el.innerHTML=units[i][1].split(' ').map(s=>{let p=by(s);return `<div class="unit"><h3>[${p.s}]</h3><p>${p.tip}</p><p><b>對比：</b>[${p.confuse}]</p><div class="row">${p.words.slice(0,4).map(w=>`<button class="secondary" data-say="${w}">🔊 ${w}</button>`).join('')}</div></div>`}).join('')+(i===8?'<p class="muted">綜合複習：建議切換至實戰篇，依序完成 41 個音標的辨音測驗。</p>':'');el.querySelectorAll('[data-say]').forEach(x=>x.onclick=()=>speak(x.dataset.say))})}
// Each phoneme has 100 deterministic slots: 50 primary and 50 advanced. All answer keys are calculated from curated word-to-phoneme assignments.
// Repeated word banks mean the 4100 slots are not 4100 unique lexical items.
function question(p,level,n){const seed=n%50,types=level==='國小'?['word','sound','contrast','listen','word']:['contrast','sound','listen','word','contrast'];const type=types[seed%5];const wi=(Math.floor(seed/5)+p.id)%p.words.length;const word=p.words[wi];let options,correct,prompt,explanation;
if(type==='sound'){let pool=P.filter(x=>x.kind===p.kind&&x.id!==p.id);let distract=[by(p.confuse),pool[(seed*3+p.id)%pool.length],pool[(seed*7+11)%pool.length]].filter(Boolean);let choices=[p,...distract];choices=[...new Map(choices.map(x=>[x.s,x])).values()];for(const x of pool){if(choices.length>=4)break;if(!choices.some(y=>y.s===x.s))choices.push(x)}options=choices.slice(0,4).map(x=>`[${x.s}]`);correct=`[${p.s}]`;prompt=`單字「${word}」的目標發音是哪個音標？`;explanation=`${word} 在本題練習的目標音為 [${p.s}]。`}
else{let distract=P.filter(x=>x.id!==p.id&&x.kind===p.kind);const near=by(p.confuse);let selected=[word];for(const x of [near,...distract.slice((seed+p.id)%Math.max(1,distract.length)),...distract]){if(x&&x.words){let w=x.words[(seed+p.id)%x.words.length];if(!selected.includes(w))selected.push(w)}if(selected.length===4)break}options=selected.slice(0,4);correct=word;prompt=type==='listen'?'🔊 請聽發音，選出包含目標音標的單字。':type==='contrast'?`哪個單字包含 [${p.s}]，而非易混淆音 [${p.confuse}]？`:`下列哪個單字包含 [${p.s}]？`;explanation=`${word} 是 [${p.s}] 的代表單字；注意與 [${p.confuse}] 的差異。`}
let shift=(seed*7+p.id)%4;options=options.slice(shift).concat(options.slice(0,shift));return {id:`${p.id}-${level==='國小'?0:1}-${n}`,p,level,n,type,word,prompt,options,correct,explanation}}
let quiz=[],idx=0,answered=false,score=0,mode='國小';function renderPractice(){document.querySelector('#practice').innerHTML=`<div class="panel"><h2>03｜分級實戰練習</h2><p class="muted">41 音 ×（國小 50 題＋國中 50 題）＝4,100 題目位置。可逐音練習，每次選 10 題或完整 50 題。</p><div class="row"><label>選擇音標 <select id="phoneme">${P.map(p=>`<option value="${p.id}">[${p.s}] — ${p.words[0]}</option>`).join('')}</select></label><label>程度 <select id="level"><option>國小</option><option>國中</option></select></label><label>題量 <select id="amount"><option value="10">10 題</option><option value="50">完整 50 題</option></select></label><button class="primary" id="start">開始練習</button></div></div><div class="panel" id="quizArea"><p class="muted">請選擇音標與程度，再開始測驗。</p></div>`;document.querySelector('#start').onclick=startQuiz}
function startQuiz(){const p=P[+document.querySelector('#phoneme').value];mode=document.querySelector('#level').value;const amount=+document.querySelector('#amount').value;quiz=Array.from({length:amount},(_,i)=>question(p,mode,i));idx=0;score=0;renderQuestion()}
function renderQuestion(){const el=document.querySelector('#quizArea');if(idx>=quiz.length){el.innerHTML=`<h2>完成練習！</h2><p>本次答對 <b>${score} / ${quiz.length}</b> 題（${Math.round(score/quiz.length*100)}%）</p><button class="primary" id="again">再練一次</button>`;document.querySelector('#again').onclick=startQuiz;return}const q=quiz[idx];answered=false;el.innerHTML=`<div class="row" style="justify-content:space-between"><b>[${q.p.s}] ${q.level}</b><span class="muted">第 ${idx+1} / ${quiz.length} 題</span></div><div class="progress"><div style="width:${idx/quiz.length*100}%"></div></div><h3>${html(q.prompt)}</h3>${q.type==='listen'?`<button class="secondary" id="listen">🔊 播放單字</button>`:''}<div class="choices">${q.options.map((o,i)=>`<button class="choice" data-answer="${i}">${String.fromCharCode(65+i)}. ${html(o)}</button>`).join('')}</div><div id="feedback"></div><button class="primary hidden" id="next">${idx===quiz.length-1?'查看成績':'下一題 →'}</button>`;if(q.type==='listen')document.querySelector('#listen').onclick=()=>speak(q.word);document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;const chosen=q.options[+b.dataset.answer],ok=chosen===q.correct;if(ok)score++;saved.done[q.id]={ok,time:new Date().toISOString()};if(!ok)saved.wrong[q.id]={p:q.p.id,level:q.level,n:q.n};else delete saved.wrong[q.id];save();document.querySelectorAll('[data-answer]').forEach(x=>{x.disabled=true;if(q.options[+x.dataset.answer]===q.correct)x.classList.add('good');else if(x===b)x.classList.add('bad')});document.querySelector('#feedback').innerHTML=`<div class="feedback"><b>${ok?'✓ 答對了':'✗ 再加油'}</b><p>${html(q.explanation)}</p><button class="secondary" id="playAnswer">🔊 聽正確單字</button></div>`;document.querySelector('#playAnswer').onclick=()=>speak(q.word);document.querySelector('#next').classList.remove('hidden')});document.querySelector('#next').onclick=()=>{idx++;renderQuestion()}}
function renderMistakes(){const items=Object.values(saved.wrong).slice(-100).reverse();document.querySelector('#mistakes').innerHTML=`<div class="panel"><h2>錯題複習</h2><p class="muted">目前記錄 ${Object.keys(saved.wrong).length} 個錯題位置。學習紀錄只儲存在這台裝置的瀏覽器中。</p>${items.length?items.map(x=>{let q=question(P[x.p],x.level,x.n);return `<div class="unit"><b>[${q.p.s}] ${x.level}｜${q.prompt}</b><p>正確答案：${q.correct}</p><small>${q.explanation}</small></div>`}).join(''):'<p>目前沒有錯題。先到實戰篇挑戰看看！</p>'}<button class="secondary" id="clearProgress">清除所有學習紀錄</button></div>`;document.querySelector('#clearProgress').onclick=()=>{if(confirm('確定清除這台裝置上的全部作答與錯題紀錄？')){saved={done:{},wrong:{}};save();renderMistakes()}}}
renderLookup();renderLessons();renderPractice();
</script></body></html>
